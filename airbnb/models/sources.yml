version: 2

sources:
  - name: airbnb
    schema: demo_dw
    tables:
      - name: customer
        identifier: dim_customer
        config:
          loaded_at_field: created_at
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 24, period: hour}
      - name: product
        identifier: dim_product
      - name: sales
        identifier: fact_sales
      - name: date
        identifier: dim_date